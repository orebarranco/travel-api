name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Quality gate (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      # Ordered cheapest first, so a style failure never pays for the test run
      # behind it. Splitting these into a second job gated with `needs:` would
      # cost a second checkout, PHP setup and install on every green run, which
      # is the common case.
      - name: Code style
        run: php vendor/bin/pint --test

      - name: Prepare environment
        # Tests run against an in-memory SQLite database (see phpunit.xml), so
        # no service container is needed — only an application key.
        run: |
          cp .env.example .env
          php artisan key:generate --quiet

      - name: Tests
        run: php vendor/bin/phpunit
